spring.application.name=personal

server.port=${SERVER_PORT:8092}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/db_trabajadores?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

reservas.base-url=${RESERVAS_BASE_URL:http://localhost:8081}